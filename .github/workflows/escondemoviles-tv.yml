name: App Fire TV (Escondemóviles)

on:
  push:
    branches: [main, 'claude/**']
    paths: ['escondemoviles/android-tv/**', '.github/workflows/escondemoviles-tv.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Opcional: si están los secretos TV_KEYSTORE_BASE64, TV_KEYSTORE_PASSWORD, TV_KEY_ALIAS y TV_KEY_PASSWORD,
      # se firma siempre con la misma clave y cada versión nueva se instala encima de la anterior.
      - name: Clave de firma
        env:
          KS: ${{ secrets.TV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/tv.jks"
            echo "TV_KEYSTORE_FILE=$RUNNER_TEMP/tv.jks" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK
        working-directory: escondemoviles/android-tv
        env:
          TV_KEYSTORE_PASSWORD: ${{ secrets.TV_KEYSTORE_PASSWORD }}
          TV_KEY_ALIAS: ${{ secrets.TV_KEY_ALIAS }}
          TV_KEY_PASSWORD: ${{ secrets.TV_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../../escondemoviles-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: escondemoviles-tv
          path: escondemoviles-tv.apk

      # En main se publica en la release "escondemoviles-tv", con un enlace fijo para descargarla desde la tele:
      # https://github.com/<usuario>/<repo>/releases/download/escondemoviles-tv/escondemoviles-tv.apk
      - name: Publicar release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view escondemoviles-tv >/dev/null 2>&1; then
            gh release upload escondemoviles-tv escondemoviles-tv.apk --clobber
          else
            gh release create escondemoviles-tv escondemoviles-tv.apk --title "Escondemóviles: app para Fire TV" \
              --notes "Instálala en el Fire TV con la app Downloader. Ver escondemoviles/README.md."
          fi
